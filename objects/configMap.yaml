apiVersion: v1
kind: Pod
metadata:
  name: myapp
spec:
  containers:
  - name: myapp
    image: mysql:latest
    ports:
    - containerPort: 3306

    env:
    - name: MYSQL_ROOT_PASSWORD
      valueFrom:
        configMapKeyRef:
          name: myapp
          key: password

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: myapp
data:
  password: "redhat"




# kubectl get configmap myapp -o yaml
